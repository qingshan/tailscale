[package]
name = "tailscale"
version = "0.6.4"
edition.workspace = true
license.workspace = true
description = "Tailscale Kindle package: tsctl LIPC runner"
build = "build.rs"

[lib]
name = "tailscale"
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[[bin]]
name = "tsctl"
path = "src/bin/tsctl.rs"
